<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#54cf17",
                        "background-light": "#f6f8f6",
                        "background-dark": "#162111",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display">
<!-- Top Navigation / Close -->
<header class="flex items-center justify-between p-6">
<button class="text-slate-900 dark:text-slate-100 p-2 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-full transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</header>
<!-- Main Content Container -->
<main class="flex-1 flex flex-col items-center justify-center px-6 pb-12">
<!-- Hero Visual Section -->
<div class="relative mb-10">
<!-- Decorative concentric circles for "pop" effect -->
<div class="absolute inset-0 bg-primary/10 rounded-full scale-150 blur-xl"></div>
<div class="absolute inset-0 bg-primary/20 rounded-full scale-125"></div>
<!-- Main Illustration/Icon Circle -->
<div class="relative w-40 h-40 bg-primary rounded-full flex items-center justify-center shadow-2xl shadow-primary/40 border-8 border-white dark:border-background-dark">
<span class="material-symbols-outlined text-white text-7xl font-bold">check</span>
</div>
<!-- Floating Streak Badge -->
<div class="absolute -bottom-2 -right-4 bg-white dark:bg-slate-800 px-4 py-2 rounded-xl shadow-lg flex items-center gap-2 border border-slate-100 dark:border-slate-700">
<span class="material-symbols-outlined text-primary text-xl">local_fire_department</span>
<span class="text-slate-900 dark:text-slate-100 font-bold text-sm">7 Day Streak</span>
</div>
</div>
<!-- Typography Block -->
<div class="text-center max-w-sm mx-auto">
<h1 class="text-slate-900 dark:text-slate-100 text-3xl font-extrabold tracking-tight mb-3">
                Vaccination Logged!
            </h1>
<p class="text-slate-600 dark:text-slate-400 text-lg leading-relaxed">
                Great job! You’re keeping your child safe and your health streak alive.
            </p>
</div>
<!-- Specific Detail Card -->
<div class="mt-8 w-full max-w-xs bg-white/50 dark:bg-slate-800/50 backdrop-blur-sm border border-slate-200 dark:border-slate-700 rounded-xl p-4 flex items-center gap-4">
<div class="w-12 h-12 bg-primary/20 rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-primary">vaccines</span>
</div>
<div class="text-left">
<p class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wider font-semibold">Logged Activity</p>
<p class="text-slate-900 dark:text-slate-100 font-bold">Polio Dose 1 Recorded</p>
</div>
</div>
</main>
<!-- Footer Action Area -->
<footer class="p-6 pb-10 space-y-4">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-[0.98]">
            Back to Health Tracker
        </button>
<button class="w-full text-slate-500 dark:text-slate-400 font-medium py-2 hover:text-primary transition-colors">
            View Full Medical History
        </button>
</footer>
<!-- Bottom Navigation Bar (Consistent with App) -->
<nav class="bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 px-4 py-2">
<div class="flex justify-between items-center max-w-md mx-auto">

</a>
<a class="flex flex-col items-center gap-1 p-2 text-slate-400 dark:text-slate-500" href="#">
